<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chaveiro Canoas</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            color: #333;
            padding-top: 140px; /* Espaço para o topo fixo não cobrir o conteúdo */
        }

        /* Topo Fixo */
        .topo-fixo {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: auto;
            background-color: #ffffff;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            z-index: 1000;
            text-align: center;
            border-bottom: 5px solid #fad201; /* Amarelo Gold */
        }

        .topo-fixo img {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 0 auto;
        }

        /* Conteúdo Principal */
        .container {
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            text-align: center;
        }

        .card {
            background: #ffffff;
            border-radius: 12px;
            padding: 40px 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            border-top: 6px solid #004691; /* Azul Gold */
        }

        .mascote {
            max-width: 180px;
            height: auto;
            margin-bottom: 20px;
        }

        h1 {
            color: #004691;
            font-size: 2.2rem;
            margin-bottom: 10px;
        }

        p {
            font-size: 1.2rem;
            color: #666;
            margin-bottom: 30px;
        }

        /* Botão de Ação Central */
        .btn-principal {
            display: inline-block;
            background-color: #004691;
            color: #ffffff;
            padding: 15px 35px;
            font-size: 1.2rem;
            font-weight: bold;
            text-decoration: none;
            border-radius: 50px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(0, 70, 145, 0.3);
        }

        .btn-principal:hover {
            background-color: #fad201;
            color: #004691;
            transform: translateY(-2px);
        }

        /* Botão Fixo do WhatsApp - Inferior Esquerdo */
        .whatsapp-fixo {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background-color: #25d366;
            color: white;
            padding: 14px 22px;
            border-radius: 50px;
            font-weight: bold;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            z-index: 9999;
            transition: transform 0.3s ease;
        }

        .whatsapp-fixo:hover {
            transform: scale(1.05);
            background-color: #20ba5a;
        }

        .whatsapp-fixo svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }

        /* Responsividade */
        @media (max-width: 600px) {
            body {
                padding-top: 100px;
            }
            h1 {
                font-size: 1.8rem;
            }
            .whatsapp-fixo {
                bottom: 15px;
                left: 15px;
                padding: 12px 18px;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>

    <!-- Banner do Topo Fixo -->
    <header class="topo-fixo">
        <!-- Substitua 'image_SujvPc.png' pelo nome do arquivo da imagem horizontal do topo -->
        <img src="topo.png" alt="Chaveiro Canoas Topo">
    </header>

    <!-- Seção de Conteúdo da Página -->
    <main class="container">
        <div class="card">
            <!-- Substitua 'image_D6Bv2r.png' pelo nome do arquivo do mascote do chaveiro -->
            <img src="icone.jpg" alt="Chaveiro Mascote" class="mascote">
            
            <h1>Atendimento Rápido</h1>
            <p>Precisa de um chaveiro em Canoas e região? Estamos prontos para te atender com agilidade e total segurança.</p>
            <p>Aberuras de residencias e Veiculos, Copias de chaves em geral, Copia de controle remoto e Tags</p>p
            
            <a href="https://wa.me" target="_blank" class="btn-principal">
                Solicite via Whatsapp
            </a>
        </div>
    </main>
</body>
</html>

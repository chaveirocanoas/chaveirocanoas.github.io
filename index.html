<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chaveiro Canoas</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f9f9f9; color: #333; padding-bottom: 60px; }
        header { background-color: #2c3e50; color: white; text-align: center; padding: 40px 20px; }
        header h1 { font-size: 2.5rem; margin-bottom: 10px; }
        header p { font-size: 1.1rem; color: #bdc3c7; }
        .container { max-width: 1200px; margin: 40px auto; padding: 0 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 30px; }
        .card { background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border: 1px solid #eee; transition: transform 0.2s; }
        .card:hover { transform: translateY(-5px); }
        .card img { width: 100%; height: 250px; object-fit: cover; background-color: #eaeaea; }
        .card-content { padding: 20px; }
        .card-title { font-size: 1.3rem; margin-bottom: 10px; color: #2c3e50; }
        .card-desc { color: #666; font-size: 0.95rem; line-height: 1.4; margin-bottom: 15px; min-height: 40px; }
        .card-price { font-size: 1.4rem; font-weight: bold; color: #27ae60; margin-bottom: 15px; }
        .btn-whats { display: block; text-align: center; background-color: #25d366; color: white; text-decoration: none; padding: 12px; border-radius: 5px; font-weight: bold; transition: background 0.2s; }
        .btn-whats:hover { background-color: #128c7e; }
        footer { text-align: center; padding: 20px; color: #7f8c8d; font-size: 0.9rem; }
    </style>
</head>
<body>

      <footer>
        <p>&copy; 2026 Vasos 3D - Todos os direitos reservados.</p>
    </footer>

</body>
</html>
